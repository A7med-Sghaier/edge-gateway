name: Deploy edge-gateway

# Auto-deploy on push to main. Runs on the self-hosted runner that lives ON the
# target server (installed via scripts/install-runner.sh), so there are no SSH
# keys or remote secrets — the runner deploys to its own host.
#
# Path responsibilities (all values come from the `Prod` environment — this file
# never contains a concrete server path, and never a fallback for one):
#   RUNNER_DIR          the runner software install — never a deploy target
#   DEPLOY_DIR          synced application source (rsync --delete destination)
#   RUNTIME_CONFIG_DIR  server-managed config; holds the base env file and the
#                       compose override. Must live OUTSIDE DEPLOY_DIR.
#
# Env assembly: CI NEVER writes the server's env file. Each job copies the
# server-managed base verbatim, appends the GitHub overlay after it (compose takes
# the LAST occurrence of a duplicate key, so GitHub wins), and writes the result to
# $RUNNER_TEMP — which is destroyed with the job, so the one place both layers meet
# on disk does not persist.
#
# DEPLOY_DIR also holds server-only state — letsencrypt/ certs, hand-authored
# traefik/dynamic/*.yml, and the generated nginx/generated/ SPA config — which the
# rsync excludes protect from --delete.

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "traefik/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy edge-gateway to ${{ matrix.server }}
    environment: Prod

    strategy:
      # Deploy to every edge server in parallel; one failing server does not
      # abort the others.
      fail-fast: false
      matrix:
        server: [edge-a, edge-b]

    # NOTE: GitHub resolves `runs-on` BEFORE applying the job's `environment:`, so an
    # environment-scoped variable here (vars.SERVER_LABEL) would expand to an empty
    # string, `runs-on` would be unschedulable, and the job would never be created —
    # the run fails with no job listed and no annotation. These matrix values are
    # literals, which is why this works. Do not replace them with an environment
    # variable; a repository-scoped variable would be required.
    runs-on: [self-hosted, edge-gateway, "${{ matrix.server }}"]

    # Never run two deploys of the same edge server at once, but let different
    # servers deploy concurrently.
    concurrency:
      group: deploy-edge-gateway-${{ matrix.server }}
      cancel-in-progress: false

    env:
      # Mapped with NO fallback values — a missing variable must fail the job loudly
      # rather than silently resolve to a guessed path.
      APP_NAME: ${{ vars.APP_NAME }}
      RUNNER_DIR: ${{ vars.RUNNER_DIR }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      RUNTIME_CONFIG_DIR: ${{ vars.RUNTIME_CONFIG_DIR }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      # Optional overrides. When unset, both derive from RUNTIME_CONFIG_DIR in
      # "Resolve and validate deployment configuration" — derived from a variable,
      # never from a hardcoded prefix.
      COMPOSE_ENV_VAR: ${{ vars.COMPOSE_ENV }}
      COMPOSE_OVERRIDE_VAR: ${{ vars.COMPOSE_OVERRIDE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve and validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          # GitHub variables keep whatever whitespace was pasted into the UI. A
          # trailing CR/newline is invisible there but lands inside any path built
          # from it — a `file://…/\r\n/compose-spec.json` schema URL once failed
          # every deploy with "net/url: invalid control character in URL". Strip it
          # from every path-ish value before it is used for anything.
          sanitize() {
            printf '%s' "${1:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          # Paths are compared by prefix below, so normalise away trailing slashes
          # (`/a/b/` vs `/a/b`) — otherwise the separation checks silently pass.
          strip_slash() {
            printf '%s' "${1%"${1##*[!/]}"}"
          }

          APP_NAME="$(sanitize "${APP_NAME:-}")"
          COMPOSE_PROJECT_NAME="$(sanitize "${COMPOSE_PROJECT_NAME:-}")"
          RUNNER_DIR="$(strip_slash "$(sanitize "${RUNNER_DIR:-}")")"
          DEPLOY_DIR="$(strip_slash "$(sanitize "${DEPLOY_DIR:-}")")"
          RUNTIME_CONFIG_DIR="$(strip_slash "$(sanitize "${RUNTIME_CONFIG_DIR:-}")")"

          # ── Required variables ──────────────────────────────────────────────
          required_variables=(
            APP_NAME
            DEPLOY_DIR
            RUNTIME_CONFIG_DIR
            COMPOSE_PROJECT_NAME
          )
          missing=0
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required deployment variable is missing: ${variable_name} (set it in the 'Prod' environment)"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1

          # RUNNER_DIR guards the deploy from writing into the runner installation,
          # so it has to describe where the runner ACTUALLY is. The runner tells us:
          # RUNNER_WORKSPACE is <runner-dir>/_work/<repo>, so its grandparent is the
          # install root. Discovering it beats a hand-set variable, which protects
          # nothing once it drifts from the box. A Prod variable still wins if set.
          if [[ -z "$RUNNER_DIR" ]]; then
            if [[ -z "${RUNNER_WORKSPACE:-}" ]]; then
              echo "::error::RUNNER_DIR is unset and RUNNER_WORKSPACE is not available to derive it — set RUNNER_DIR in the 'Prod' environment"
              exit 1
            fi
            RUNNER_DIR="$(cd "$RUNNER_WORKSPACE/../.." && pwd)"
          fi

          # Derive the server-managed paths from RUNTIME_CONFIG_DIR unless the
          # environment pins them explicitly.
          BASE_ENV="$(strip_slash "$(sanitize "${COMPOSE_ENV_VAR:-}")")"
          [[ -n "$BASE_ENV" ]] || BASE_ENV="$RUNTIME_CONFIG_DIR/.env"
          COMPOSE_OVERRIDE="$(strip_slash "$(sanitize "${COMPOSE_OVERRIDE_VAR:-}")")"
          OVERRIDE_PINNED=1
          if [[ -z "$COMPOSE_OVERRIDE" ]]; then
            OVERRIDE_PINNED=0
            COMPOSE_OVERRIDE="$RUNTIME_CONFIG_DIR/docker-compose.override.yml"
          fi

          # ── Absolute paths ──────────────────────────────────────────────────
          path_variables=(RUNNER_DIR DEPLOY_DIR RUNTIME_CONFIG_DIR BASE_ENV COMPOSE_OVERRIDE)
          for variable_name in "${path_variables[@]}"; do
            if [[ "${!variable_name}" != /* ]]; then
              echo "::error::${variable_name} must contain an absolute path"
              exit 1
            fi
          done

          # ── The deploy must never write into the runner installation ────────
          for variable_name in DEPLOY_DIR RUNTIME_CONFIG_DIR; do
            variable_value="${!variable_name}"
            if [[ "$variable_value" == "$RUNNER_DIR" || "$variable_value" == "$RUNNER_DIR/"* ]]; then
              echo "::error::${variable_name} overlaps the runner installation (RUNNER_DIR)"
              exit 1
            fi
          done

          # ── Server-managed config must survive `rsync --delete` ─────────────
          # Anything inside DEPLOY_DIR is a sync destination; the base env file and
          # the override live there only by mistake, and the mistake destroys them.
          for variable_name in RUNTIME_CONFIG_DIR BASE_ENV COMPOSE_OVERRIDE; do
            variable_value="${!variable_name}"
            if [[ "$variable_value" == "$DEPLOY_DIR" || "$variable_value" == "$DEPLOY_DIR/"* ]]; then
              echo "::error::${variable_name} must be outside DEPLOY_DIR — the deploy's rsync --delete would destroy it"
              exit 1
            fi
          done

          # ── Permission preflight ────────────────────────────────────────────
          # Check both halves up front: without this the first symptom is a bare
          # "Permission denied" from a redirect deep inside a later step.
          if [[ -e "$DEPLOY_DIR" && ! -w "$DEPLOY_DIR" ]]; then
            echo "::error::DEPLOY_DIR is not writable by $(id -un) on $(hostname -s)"
            exit 1
          fi
          if [[ ! -e "$BASE_ENV" ]]; then
            echo "::error::The server-managed base env file (COMPOSE_ENV, default \$RUNTIME_CONFIG_DIR/.env) does not exist on $(hostname -s). It carries this server's ROUTE_*/APP_* blocks — without it every file-provider route disappears. Provision it on the host."
            exit 1
          fi
          if [[ ! -r "$BASE_ENV" ]]; then
            echo "::error::The server-managed base env file is not readable by $(id -un) on $(hostname -s)"
            exit 1
          fi

          # A pinned override that has gone missing is the exact silent failure this
          # guards: Traefik comes up on `web` only and every labelled backend 504s.
          if [[ "$OVERRIDE_PINNED" -eq 1 && ! -f "$COMPOSE_OVERRIDE" ]]; then
            echo "::error::COMPOSE_OVERRIDE is pinned in the 'Prod' environment but the file does not exist on $(hostname -s). It attaches this edge to the app data-plane network(s) — create it, or clear the COMPOSE_OVERRIDE variable to fall back to \$RUNTIME_CONFIG_DIR/docker-compose.override.yml."
            exit 1
          fi

          {
            echo "APP_NAME=$APP_NAME"
            echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME"
            echo "RUNNER_DIR=$RUNNER_DIR"
            echo "DEPLOY_DIR=$DEPLOY_DIR"
            echo "RUNTIME_CONFIG_DIR=$RUNTIME_CONFIG_DIR"
            echo "BASE_ENV=$BASE_ENV"
            echo "MERGED_ENV=$RUNNER_TEMP/$APP_NAME.env"
          } >> "$GITHUB_ENV"

          if [[ -f "$COMPOSE_OVERRIDE" ]]; then
            echo "COMPOSE_OVERRIDE=$COMPOSE_OVERRIDE" >> "$GITHUB_ENV"
            echo "Configuration OK — merging the server-local compose override."
          else
            echo "COMPOSE_OVERRIDE=" >> "$GITHUB_ENV"
            echo "Configuration OK — no compose override present; base compose only."
          fi

      - name: Synchronize application files
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0750 "$DEPLOY_DIR"
          # --delete keeps the deploy dir in sync with the repo. Excluded paths are
          # ALSO protected from deletion, which is how the server-only state below
          # survives every deploy.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='docker-compose.override.yml' \
            --exclude='letsencrypt/' \
            --exclude='traefik/dynamic/*.yml' \
            --exclude='traefik/dynamic/*.yaml' \
            --exclude='traefik/.rendered.sha256' \
            --exclude='nginx/generated/' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Render the effective Traefik static config
        # Traefik's static-configuration sources are MUTUALLY EXCLUSIVE: the loader
        # chain is file → flags → env and stops at the first that resolves, and it
        # reads exactly ONE file. So neither the per-server entrypoints nor the ACME
        # email can arrive as a TRAEFIK_* variable, a compose `command:` flag, or a
        # second config file — both have to be merged into the one file Traefik loads.
        #
        # Base (repo, synced) + overlay ($RUNTIME_CONFIG_DIR/traefik.override.yml,
        # server-managed and read-only to this job) + the ACME email secret, written
        # to the SYNCED copy — which the rsync overwrites every run, so the result
        # never drifts.
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || secrets.TRAEFIK_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          static_config="$DEPLOY_DIR/traefik/traefik.yml"
          static_overlay="$RUNTIME_CONFIG_DIR/traefik.override.yml"
          test -f "$static_config"

          if ! python3 -c 'import yaml' 2>/dev/null; then
            echo "::error::python3 cannot import yaml on $(hostname -s) — the static-config merge needs it. Install it once: sudo apt-get install -y python3-yaml"
            exit 1
          fi
          if [[ -e "$static_overlay" && ! -r "$static_overlay" ]]; then
            echo "::error::The per-server Traefik overlay exists but is not readable by $(id -un) on $(hostname -s)"
            exit 1
          fi
          # Validate the FORMAT, not just presence. An address Let's Encrypt cannot
          # parse fails ACME account registration outright — "cannot get ACME client"
          # — which disables the resolver for EVERY host, not just the new one, and
          # takes renewals down with it. Certificates already in acme.json keep being
          # served, so the damage is invisible until a renewal is due.
          #
          # Degrading to no email is deliberately preferred over failing the deploy:
          # an anonymous ACME account issues and renews perfectly well, whereas a
          # hard failure here would leave the previous broken config running.
          ACME_EMAIL="$(printf '%s' "${ACME_EMAIL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$ACME_EMAIL" ]]; then
            echo "::warning::No ACME_EMAIL/TRAEFIK_EMAIL secret set — Let's Encrypt will register the account without an email address, so no expiry notices are sent. Certificates still issue."
          # Held in a variable: an inline ERE is subject to the shell's own quote
          # handling, which silently turned `\.` into a plain `.` and let an address
          # with no TLD through.
          elif acme_email_re='^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$'
               [[ ! "$ACME_EMAIL" =~ $acme_email_re ]]; then
            echo "::warning::The ACME_EMAIL/TRAEFIK_EMAIL secret is not a bare email address, so it is being ignored — Let's Encrypt rejects an unparseable contact and that disables certificate issuance and renewal for every host. Re-set it to a plain address with no display name, quotes or spaces: gh secret set TRAEFIK_EMAIL --env Prod --body 'you@example.com'"
            ACME_EMAIL=""
          fi
          export ACME_EMAIL

          # Values arrive via env (never interpolated into the script body) so a
          # secret cannot inject Python, and are never echoed.
          STATIC_CONFIG="$static_config" STATIC_OVERLAY="$static_overlay" python3 - <<'PY'
          import os, sys, yaml

          # An entrypoint address dumps as the plain scalar `address: :80`, whose
          # leading colon is an edge case no parser should have to adjudicate — and
          # a static config Traefik cannot read takes the whole edge down. Quote it.
          def _represent_str(dumper, data):
              style = "'" if data.startswith((":", "*", "&", "!", "%", "@", "`")) else None
              return dumper.represent_scalar("tag:yaml.org,2002:str", data, style=style)

          yaml.add_representer(str, _represent_str, Dumper=yaml.SafeDumper)

          base_path = os.environ["STATIC_CONFIG"]
          overlay_path = os.environ["STATIC_OVERLAY"]
          email = os.environ.get("ACME_EMAIL", "")

          with open(base_path, encoding="utf-8") as fh:
              config = yaml.safe_load(fh) or {}

          def deep_merge(base, overlay, path=""):
              """Mappings merge key-by-key; everything else is replaced wholesale."""
              for key, value in overlay.items():
                  here = f"{path}.{key}" if path else key
                  if isinstance(value, dict) and isinstance(base.get(key), dict):
                      deep_merge(base[key], value, here)
                  else:
                      if key in base:
                          print(f"overlay replaces {here}")
                      else:
                          print(f"overlay adds {here}")
                      base[key] = value
              return base

          if os.path.exists(overlay_path):
              with open(overlay_path, encoding="utf-8") as fh:
                  overlay = yaml.safe_load(fh) or {}
              if not isinstance(overlay, dict):
                  sys.exit("::error::The per-server Traefik overlay must be a YAML mapping")
              deep_merge(config, overlay)
          else:
              print("No per-server Traefik overlay on this host — using the repo base.")

          if email:
              try:
                  config["certificatesResolvers"]["le"]["acme"]["email"] = email
              except (KeyError, TypeError):
                  sys.exit("::error::No certificatesResolvers.le.acme block in the "
                           "merged static config — cannot set the ACME email.")

          with open(base_path, "w", encoding="utf-8") as fh:
              yaml.safe_dump(config, fh, default_flow_style=False, sort_keys=False)

          print("entrypoints:", ", ".join(config.get("entryPoints", {})))
          PY

          # Traefik reads static config ONLY at startup and `up -d` does not recreate
          # a container because a bind-mounted file changed underneath it — so
          # rendering without this check silently leaves the old config running. That
          # has already cost two debugging sessions.
          #
          # The rendered file cannot be compared against itself between runs (the
          # rsync overwrites it with the repo base every time), so the previous
          # result's checksum is kept beside it, excluded from the sync. It is
          # written only AFTER the restart actually happens, so a deploy that fails
          # in between still reports the change on the next run.
          rendered_sum="$(sha256sum "$static_config" | cut -d' ' -f1)"
          previous_sum=""
          [[ -f "$DEPLOY_DIR/traefik/.rendered.sha256" ]] &&
            previous_sum="$(cat "$DEPLOY_DIR/traefik/.rendered.sha256")"

          {
            echo "RENDERED_STATIC_SUM=$rendered_sum"
            if [[ "$rendered_sum" == "$previous_sum" ]]; then
              echo "STATIC_CONFIG_CHANGED=0"
            else
              echo "STATIC_CONFIG_CHANGED=1"
            fi
          } >> "$GITHUB_ENV"

      - name: Assemble the runtime environment
        # Base (server-managed, verbatim) + GitHub overlay (appended after, so it
        # wins on duplicate keys) → $RUNNER_TEMP, which the runner wipes with the
        # job. The server's own env file is never written by CI.
        env:
          DASHBOARD_HOST: ${{ vars.DASHBOARD_HOST }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || secrets.TRAEFIK_EMAIL }}
          DASHBOARD_AUTH: ${{ secrets.DASHBOARD_AUTH }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # 1. Base, copied verbatim. Carries this server's ROUTE_*/APP_* blocks.
          cp "$BASE_ENV" "$MERGED_ENV"
          chmod 0600 "$MERGED_ENV"

          # 2. Overlay.
          append_env() {
            local key="$1" value="${2-}"
            # An unset value written as `NAME=` would OVERRIDE the inherited base
            # value with an empty string — the merge equivalent of deleting it.
            [[ -n "$value" ]] || return 0
            # A newline splits the value across two lines and corrupts every line
            # after it.
            case "$value" in
              *[$'\n\r']*)
                echo "::error::${key} contains a newline — refusing to write it"
                exit 1
                ;;
            esac
            # Compose interpolates --env-file values, so a lone `$` SILENTLY
            # TRUNCATES the value at that point (`a$b` arrives as `a`). `$$` is the
            # documented escape and round-trips to a literal `$`.
            printf '%s=%s\n' "$key" "${value//\$/\$\$}" >> "$MERGED_ENV"
          }

          append_env ACME_EMAIL     "${ACME_EMAIL:-}"
          append_env DASHBOARD_HOST "${DASHBOARD_HOST:-}"
          append_env DASHBOARD_AUTH "${DASHBOARD_AUTH:-}"

          # 3. Validate the assembled result by FORMAT, not just presence — a
          #    present-but-empty ACME_EMAIL passes a non-empty check and still leaves
          #    the ACME account unregistered.
          if ! grep -qE '^ACME_EMAIL=.+' "$MERGED_ENV"; then
            echo "::warning::The assembled environment has no non-empty ACME_EMAIL. Certificates still issue, but the ACME account gets no expiry notices."
          fi

          echo "Assembled runtime environment ($(grep -c '=' "$MERGED_ENV") keys)."

      - name: Resolve the compose invocation
        shell: bash
        run: |
          set -euo pipefail
          args="--project-name $COMPOSE_PROJECT_NAME"
          args="$args --project-directory $DEPLOY_DIR"
          # --env-file supplies compose-file interpolation AND, via
          # ${COMPOSE_ENV:-.env} in docker-compose.yml, route-generator's env_file.
          args="$args --env-file $MERGED_ENV"
          args="$args -f $DEPLOY_DIR/docker-compose.yml"
          if [[ -n "${COMPOSE_OVERRIDE:-}" ]]; then
            args="$args -f $COMPOSE_OVERRIDE"
          fi
          echo "COMPOSE_ARGS=$args" >> "$GITHUB_ENV"
          # Point the compose file's env_file at the MERGED result, not the base, so
          # route-generator sees the GitHub overlay too. The shell environment beats
          # --env-file for interpolation, so this wins.
          echo "COMPOSE_ENV=$MERGED_ENV" >> "$GITHUB_ENV"

      - name: Validate Docker access
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Validate the Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOY_DIR/docker-compose.yml"
          test -f "$MERGED_ENV"
          [[ -z "${COMPOSE_OVERRIDE:-}" ]] || test -f "$COMPOSE_OVERRIDE"
          docker compose $COMPOSE_ARGS config --quiet

      - name: Render routes and deploy
        shell: bash
        run: |
          set -euo pipefail
          # Ensure every external network the MERGED config references exists. The
          # base declares the shared `web` net; a server-local override may add app
          # data-plane nets. Discovering them (rather than hardcoding a list) keeps
          # the committed base app-agnostic and makes the deploy self-healing after a
          # `docker network prune`.
          docker compose $COMPOSE_ARGS config --format json \
            | python3 -c 'import sys, json; [print(n.get("name", k)) for k, n in json.load(sys.stdin).get("networks", {}).items() if n.get("external")]' \
            | while read -r net; do
                docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
              done

          docker compose $COMPOSE_ARGS pull --quiet traefik route-generator edge-spa
          # Re-renders traefik/dynamic/routes.yml + nginx/generated/spa.conf.
          docker compose $COMPOSE_ARGS run --rm route-generator
          # Traefik hot-reloads its dynamic files; compose only restarts what changed.
          traefik_before="$(docker compose $COMPOSE_ARGS ps -q traefik || true)"
          docker compose $COMPOSE_ARGS up -d --remove-orphans
          traefik_after="$(docker compose $COMPOSE_ARGS ps -q traefik)"

          # Restart ONLY when the static config changed and compose did not already
          # recreate the container — a recreated container has read the new file
          # anyway, and an unnecessary restart drops every live connection through
          # the edge.
          if [[ "${STATIC_CONFIG_CHANGED:-0}" == "1" ]]; then
            if [[ -n "$traefik_before" && "$traefik_before" == "$traefik_after" ]]; then
              echo "Static config changed — restarting Traefik to load it."
              docker compose $COMPOSE_ARGS restart traefik
            else
              echo "Static config changed; compose recreated Traefik, which already loaded it."
            fi
          else
            echo "Static config unchanged — no Traefik restart needed."
          fi
          # Recorded only now, so a failure above leaves the change pending.
          printf '%s\n' "$RENDERED_STATIC_SUM" > "$DEPLOY_DIR/traefik/.rendered.sha256"

          # edge-spa nginx must be TOLD to re-read the regenerated spa.conf when its
          # container wasn't recreated (e.g. a pure .env change). Validate first; skip
          # cleanly if edge-spa isn't running.
          if docker compose $COMPOSE_ARGS ps -q edge-spa | grep -q .; then
            docker compose $COMPOSE_ARGS exec -T edge-spa nginx -t \
              && docker compose $COMPOSE_ARGS exec -T edge-spa nginx -s reload
          fi

      - name: Verify the edge joined every network its config declares
        # The incident this guards: Traefik silently came up on `web` only (override
        # not merged) and every labelled backend on the data-plane network 504'd.
        shell: bash
        run: |
          set -euo pipefail
          want="$(docker compose $COMPOSE_ARGS config --format json \
            | python3 -c 'import sys, json; s=json.load(sys.stdin)["services"]["traefik"]; print("\n".join((s.get("networks") or {}).keys()))')"
          cid="$(docker compose $COMPOSE_ARGS ps -q traefik)"
          have="$(docker inspect "$cid" --format '{{range $n,$c := .NetworkSettings.Networks}}{{$n}}{{"\n"}}{{end}}')"
          missing=""
          for n in $want; do
            printf '%s\n' "$have" | grep -qx "$n" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::edge-traefik is NOT attached to:$missing — the override did not merge. Every labelled backend on those networks will 504."
            exit 1
          fi
          echo "OK: edge-traefik attached to all declared networks ($(printf '%s' "$want" | tr '\n' ' '))"

      - name: Show status
        if: always()
        shell: bash
        run: docker compose ${COMPOSE_ARGS:--f docker-compose.yml} ps
