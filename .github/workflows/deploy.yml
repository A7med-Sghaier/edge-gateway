name: Deploy edge-gateway

# Auto-deploy on push to main. Runs on the self-hosted runner that lives ON the
# target server (installed via scripts/install-runner.sh), so there are no SSH
# keys or remote secrets — the runner deploys to its own host.
#
# Strategy: actions/checkout wipes the runner workspace each run, so we sync the
# tracked files into a stable DEPLOY_DIR. That dir also holds the server-only state
# — letsencrypt/ certs and the hand-authored traefik/dynamic/*.yml — which the sync
# preserves (never deleted). The .env (COMPOSE_ENV) and the gitignored override
# (COMPOSE_OVERRIDE) are configured to live OUTSIDE DEPLOY_DIR so the rsync --delete
# can never touch them; the .env is (re)written fresh each run from the `Prod`
# environment's secrets/vars. Then we re-render routes and reload Traefik.

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "traefik/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy edge-gateway to ${{ matrix.server }}
    environment: Prod

    strategy:
      # Deploy to every edge server in parallel; one failing server does not
      # abort the others.
      fail-fast: false
      matrix:
        server: [edge-a, edge-b]
    runs-on: [self-hosted, edge-gateway, "${{ matrix.server }}"]
    # Never run two deploys of the same edge server at once, but let different
    # servers deploy concurrently.
    concurrency:
      group: deploy-edge-gateway-${{ matrix.server }}
      cancel-in-progress: false
    
    env:
      # Stable deploy dir on the runner's own host — CI rsyncs the tracked repo here
      # (base docker-compose.yml, scripts, traefik static config) and it holds the
      # letsencrypt/ certs. It's a path, not a secret — override via env-var/secret.
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR || '$DEPLOY_DIR/' }}
      # Server-local files kept OUTSIDE DEPLOY_DIR so the `rsync --delete` can never
      # touch them. Set as environment VARIABLES in the `Prod` environment:
      #   COMPOSE_ENV       abs path to the .env compose reads   (e.g. $RUNTIME_CONFIG_DIR/.env)
      #   COMPOSE_OVERRIDE  abs path to the gitignored override  (e.g. $RUNTIME_CONFIG_DIR/docker-compose.override.yml)
      # COMPOSE_OVERRIDE is what attaches this edge to the app data-plane network(s);
      # without it Traefik comes up on `web` only and every labelled backend 504s.
      # Both optional: unset COMPOSE_OVERRIDE → base compose only (app-agnostic);
      # unset COMPOSE_ENV → falls back to DEPLOY_DIR/.env.
      COMPOSE_ENV: ${{ vars.COMPOSE_ENV }}
      COMPOSE_OVERRIDE: ${{ vars.COMPOSE_OVERRIDE }}
      # Native compose var → pins the project name (and thus container names)
      # regardless of cwd. Defaults to the base compose's `name:`.
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'edge-gateway' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync tracked files into deploy dir
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          # --delete keeps the deploy dir in sync with the repo, but we exclude the
          # server-only state so it survives every deploy.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='docker-compose.override.yml' \
            --exclude='letsencrypt/' \
            --exclude='traefik/dynamic/*.yml' \
            --exclude='traefik/dynamic/*.yaml' \
            ./ "$DEPLOY_DIR/"

      - name: Resolve compose invocation
        # Build the flags every later `docker compose` call shares, from the Prod
        # variables: the env file to read and the server-local override to merge.
        # Fails loudly if COMPOSE_OVERRIDE is set but missing — the exact silent
        # failure (Traefik off the data-plane net → tenant 504s) that this guards.
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          env_path="${COMPOSE_ENV:-$DEPLOY_DIR/.env}"
          args="-f docker-compose.yml"
          if [ -n "${COMPOSE_OVERRIDE:-}" ]; then
            if [ ! -f "$COMPOSE_OVERRIDE" ]; then
              echo "::error::COMPOSE_OVERRIDE points at '$COMPOSE_OVERRIDE' but that file does not exist on $(hostname -s). It attaches this edge to the app data-plane network — create it (see DEPLOY-<server>.local.md) or clear the COMPOSE_OVERRIDE variable."
              exit 1
            fi
            args="$args -f $COMPOSE_OVERRIDE"
          fi
          # --env-file first so ${ACME_EMAIL} interpolation resolves. Persist for later steps.
          echo "ENV_PATH=$env_path" >> "$GITHUB_ENV"
          echo "COMPOSE_ARGS=--env-file $env_path $args" >> "$GITHUB_ENV"

      - name: Ensure .env is present (write from secrets, or verify if root-managed)
        # COMPOSE_ENV may be a root-managed file the runner can only READ (the single
        # source of secrets on the host, e.g. root:github-runner rw-r-----). If we CAN
        # write it, (re)generate it from the Prod secrets; if not, treat it as externally
        # managed and just validate it. Values arrive via env: (NOT interpolated into the
        # script body) so a secret can't inject shell, and are written with printf %s so a
        # DASHBOARD_AUTH htpasswd hash containing `$` stays literal.
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || secrets.TRAEFIK_EMAIL }}
          DASHBOARD_HOST: ${{ vars.DASHBOARD_HOST }}
          DASHBOARD_AUTH: ${{ secrets.DASHBOARD_AUTH }}
        run: |
          set -euo pipefail
          if [ -w "$ENV_PATH" ] || { [ ! -e "$ENV_PATH" ] && mkdir -p "$(dirname "$ENV_PATH")" 2>/dev/null && [ -w "$(dirname "$ENV_PATH")" ]; }; then
            if [ -z "${ACME_EMAIL:-}" ]; then
              echo "::error::ACME_EMAIL is empty. Set secret ACME_EMAIL (or TRAEFIK_EMAIL) in the 'Prod' environment, or pre-provision $ENV_PATH on the host."
              exit 1
            fi
            umask 077
            {
              printf 'ACME_EMAIL=%s\n' "$ACME_EMAIL"
              if [ -n "${DASHBOARD_HOST:-}" ]; then printf 'DASHBOARD_HOST=%s\n' "$DASHBOARD_HOST"; fi
              if [ -n "${DASHBOARD_AUTH:-}" ]; then printf 'DASHBOARD_AUTH=%s\n' "$DASHBOARD_AUTH"; fi
            } > "$ENV_PATH"
            chmod 600 "$ENV_PATH"
            echo "Wrote $ENV_PATH from Prod secrets."
          else
            # Read-only to the runner → root-managed on the host. Validate, don't touch.
            [ -s "$ENV_PATH" ] || { echo "::error::$ENV_PATH is missing/empty and not writable by the runner — provision it on the host (must contain ACME_EMAIL=…)."; exit 1; }
            grep -q '^ACME_EMAIL=' "$ENV_PATH" || echo "::warning::$ENV_PATH has no ACME_EMAIL= line — Traefik ACME may fail."
            echo "Using externally-managed $ENV_PATH (not writable by runner) — left as-is."
          fi

      - name: Render routes + reload edge
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Ensure every external network the MERGED compose config references exists.
          # The base declares the shared `web` net; a server-local
          # docker-compose.override.yml may add app data-plane nets (e.g. app-traffic).
          # Creating them here (idempotent) makes the deploy self-healing after a
          # `docker network prune` or a full `docker system prune`, while keeping the
          # committed base app-agnostic — the network list is discovered, not hardcoded.
          docker compose $COMPOSE_ARGS config --format json \
            | python3 -c 'import sys, json; [print(n.get("name", k)) for k, n in json.load(sys.stdin).get("networks", {}).items() if n.get("external")]' \
            | while read -r net; do
                docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
              done
          docker compose $COMPOSE_ARGS pull --quiet traefik route-generator
          docker compose $COMPOSE_ARGS run --rm route-generator   # re-renders traefik/dynamic/routes.yml from COMPOSE_ENV
          docker compose $COMPOSE_ARGS up -d --remove-orphans      # Traefik hot-reloads; only restarts on compose changes

      - name: Verify the edge joined every network its config declares
        # The incident this whole workflow rev fixes: Traefik silently came up on `web`
        # only (override not merged) and every labelled backend on app-traffic 504'd.
        # Assert the running container is on all networks the MERGED config assigns to it.
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          want="$(docker compose $COMPOSE_ARGS config --format json \
            | python3 -c 'import sys, json; s=json.load(sys.stdin)["services"]["traefik"]; print("\n".join((s.get("networks") or {}).keys()))')"
          cid="$(docker compose $COMPOSE_ARGS ps -q traefik)"
          have="$(docker inspect "$cid" --format '{{range $n,$c := .NetworkSettings.Networks}}{{$n}}{{"\n"}}{{end}}')"
          missing=""
          for n in $want; do
            printf '%s\n' "$have" | grep -qx "$n" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::edge-traefik is NOT attached to:$missing — the override did not merge. Every labelled backend on those networks will 504. Check the COMPOSE_OVERRIDE variable and file."
            exit 1
          fi
          echo "OK: edge-traefik attached to all declared networks ($(printf '%s' "$want" | tr '\n' ' '))"

      - name: Show status
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose ${COMPOSE_ARGS:--f docker-compose.yml} ps
