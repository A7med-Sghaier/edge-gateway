# Traefik STATIC configuration (loaded once at startup).
# Per-app routing lives in the file-provider dir (./traefik/dynamic), generated
# from .env by scripts/generate-routes.sh — do not hand-edit routes here.

global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    # Force every plain-HTTP request to HTTPS.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Extra entrypoints (raw-TCP backends such as MongoDB) are PER-SERVER and are
  # NOT declared here — see traefik.override.example.yml. The deploy deep-merges
  # $RUNTIME_CONFIG_DIR/traefik.override.yml over this file, so each host adds only
  # the entrypoints it actually uses.

providers:
  # (1) File provider — routes declared in .env, rendered into this directory.
  #     Use this for apps that DON'T carry their own Traefik labels.
  file:
    directory: /etc/traefik/dynamic
    watch: true

  # (2) Docker provider — label-driven apps opt in with `traefik.enable=true`.
  #     This is how a labelled multi-tenant stack is discovered (its tenant
  #     containers already carry all routing/middleware labels on their own
  #     shared data-plane network, which this edge joins via the server-local
  #     docker-compose.override.yml). `exposedByDefault: false` = ignore any
  #     container that doesn't explicitly opt in. `network: web` is the default
  #     backend network; an app overrides it per-container with
  #     `traefik.docker.network=<its-network>`.
  docker:
    exposedByDefault: false
    network: web

certificatesResolvers:
  le:
    acme:
      # `email:` is deliberately absent here — the deploy sets it in the SYNCED copy
      # from the Prod secret, so the address stays out of the repo.
      #
      # It cannot be injected as a TRAEFIK_* environment variable. Traefik's static
      # configuration sources are MUTUALLY EXCLUSIVE — the loader chain is
      # file → flags → env and stops at the first that resolves — so while this file
      # is mounted at /etc/traefik/traefik.yml the file loader wins and every
      # TRAEFIK_* variable is ignored. (Missing email is not fatal: ACME registers
      # the account anonymously and certs still issue, you just get no expiry notice.)
      storage: /letsencrypt/acme.json
      # TLS-ALPN challenge works out of the box for single hostnames.
      # For wildcard certs, switch to a dnsChallenge block instead (see README).
      tlsChallenge: {}

api:
  dashboard: true

log:
  level: INFO

accessLog: {}
